<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}</style>
<title>Compte rendu Copil</title>
<meta name="theme-color" content="#f3f4f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow notes column — dull meeting header, ruled 5×5 keyword sheet, slide-up note card. Disguised as minutes; marks look like pen circles. */
:root{
  --bg:#f3f4f7;
  --surface:#ffffff;
  --ink:#1d2331;
  --muted:#6b7385;
  --line:#dfe2ea;
  --pen:#5d6681;
  --pen-soft:#f2f3f6;
  --pen-wash:#e7e9ef;
  --shadow:0 10px 30px -12px rgba(29,35,49,.28);
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --surface:#181c24; --ink:#d5dae4; --muted:#7f879a; --line:#262b36;
    --pen:#8b92a4; --pen-soft:#1b1f27; --pen-wash:#21262f;
    --shadow:0 12px 34px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#181c24; --ink:#d5dae4; --muted:#7f879a; --line:#262b36;
  --pen:#8b92a4; --pen-soft:#1b1f27; --pen-wash:#21262f;
  --shadow:0 12px 34px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

.app{
  box-sizing:border-box;max-width:560px;min-height:100%;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 120px;
  display:flex;flex-direction:column;gap:22px;
}

/* ---------- header: looks like any notes app ---------- */
.crumbs{display:flex;justify-content:space-between;align-items:center;font:400 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.02em}
.crumbs .sync{display:inline-flex;align-items:center;gap:6px}
.crumbs .sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.55}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:14px}
h1{margin:0;font:600 clamp(20px,5.4vw,25px)/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance;min-width:0}
.meta{margin-top:8px;color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px}
.meta span{font-variant-numeric:tabular-nums}

.icon-btn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,border-color .2s,transform .15s}
.icon-btn:hover{color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .off{display:none}
.veiled .icon-btn .on-i{display:none}
.veiled .icon-btn .off{display:block}

/* ---------- sheet ---------- */
.sheet{display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;justify-content:flex-end;align-items:baseline;gap:12px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.chip{font:500 12px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;padding:6px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);perspective:300px;white-space:nowrap;transition:color .3s,background .3s,border-color .3s}
.chip.flash{color:var(--pen);background:var(--pen-soft);border-color:var(--pen-wash);font-weight:600;letter-spacing:.06em}
.chip span{display:inline-block;transform-origin:50% 60%;animation:flip .55s cubic-bezier(.2,.8,.3,1.3) both;animation-delay:calc(var(--k) * 55ms)}
@keyframes flip{from{opacity:0;transform:rotateX(-100deg) translateY(-3px)}}

.grid-wrap{position:relative;transition:filter .35s}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.cell{
  position:relative;aspect-ratio:1;min-width:0;margin:0;border:0;border-radius:0;
  background:var(--surface);color:var(--ink);cursor:pointer;
  padding:6px 4px;display:grid;place-items:center;text-align:center;
  font:500 clamp(9.5px,2.75vw,13.5px)/1.18 var(--f-ui);
  hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;
  transition:background .3s ease,color .3s ease;
  animation:deal .55s cubic-bezier(.2,.8,.25,1) both;animation-delay:var(--d,0ms);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
@keyframes deal{from{opacity:.15;transform:translateY(8px) scale(.94)}}
.cell:hover{background:var(--pen-soft)}
.cell:focus-visible{outline:2px solid var(--pen);outline-offset:-3px;z-index:2}
.cell .w{position:relative;z-index:1;max-width:100%;transition:filter .35s,opacity .35s}
.cell.on{color:var(--pen);background:var(--pen-soft)}
.cell.win{background:var(--pen-wash)}

/* hand-drawn circle around a marked word */
.ring{position:absolute;inset:6%;width:88%;height:88%;overflow:visible;pointer-events:none;transform:rotate(var(--rot,0deg))}
.ring path{fill:none;stroke:var(--pen);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:.7;transition:stroke-dashoffset .5s cubic-bezier(.55,.1,.3,1)}
.cell.on .ring path{stroke-dashoffset:0}

/* pen stroke through a completed line */
.strikes{position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);pointer-events:none;overflow:visible}
.strikes path{fill:none;stroke:var(--pen);stroke-width:4;stroke-linecap:round;opacity:.32;stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .7s .25s cubic-bezier(.6,0,.25,1) forwards}
.strikes path.out{animation:fadeout .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeout{from{stroke-dashoffset:0}to{stroke-dashoffset:0;opacity:0}}

.fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.dot{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--pen);opacity:.7}
.dot.dash{width:9px;height:2px;margin:-1px 0 0 -4.5px;border-radius:2px}

.veiled .grid-wrap .w{filter:blur(7px);opacity:.55}
.veiled .grid-wrap .ring,.veiled .grid-wrap .strikes{opacity:.25}

.foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;color:var(--muted);font-size:12.5px}
.text-btn{font:500 13px/1 var(--f-ui);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;transition:color .2s,border-color .2s,background .2s;white-space:nowrap}
.text-btn:hover{color:var(--ink)}
.text-btn.armed{color:var(--pen);border-color:var(--pen);background:var(--pen-soft)}
.text-btn:focus-visible,.icon-btn:focus-visible,.toast button:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

/* decoy notes under the grid, adds to the cover */
.notes{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px;line-height:1.5}
.notes h2{margin:0 0 2px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* ---------- slide-up note card (the BINGO moment) ---------- */
.toast{
  position:fixed;left:50%;z-index:20;box-sizing:border-box;
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  width:min(420px, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:14px 14px 14px 16px;display:flex;align-items:center;gap:14px;
  transform:translate(-50%,150%);opacity:0;pointer-events:none;
  transition:transform .55s cubic-bezier(.2,.9,.25,1.12),opacity .3s;
}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast-mark{flex:none;width:40px;height:40px}
.toast-mark circle{fill:var(--pen-soft)}
.toast-mark path{fill:none;stroke:var(--pen);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.toast.show .toast-mark path{animation:draw .6s .35s cubic-bezier(.6,0,.25,1) forwards}
.toast-body{flex:1;min-width:0}
.toast-word{font:600 21px/1.1 var(--f-display);color:var(--pen);letter-spacing:.04em;white-space:nowrap}
.toast-word span{display:inline-block}
.toast.show .toast-word span{animation:pop .6s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:calc(var(--k) * 60ms + 140ms)}
@keyframes pop{0%{opacity:0;transform:translateY(80%) rotate(-14deg) scale(.5)}60%{opacity:1}}
.toast-sub{margin-top:4px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast-actions{display:flex;gap:6px;flex:none}
.toast button{font:500 12.5px/1 var(--f-ui);border-radius:999px;padding:9px 12px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--muted)}
.toast button.primary{background:var(--pen);border-color:var(--pen);color:var(--surface)}

@media (max-width:380px){
  .toast{flex-wrap:wrap}
  .toast-actions{width:100%;justify-content:flex-end}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app" lang="fr" id="app">
  <header>
    <div class="crumbs"><span>Notes › Projets › T4</span><span class="sync">Synchronisé</span></div>
    <div class="title-row">
      <h1>Plénière</h1>
      <button class="icon-btn" id="veil" type="button" aria-label="Masquer le contenu" aria-pressed="false">
        <svg class="on-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <div class="meta"><span id="date">—</span><span id="clock">—</span></div>
  </header>

  <section class="sheet" id="sheet">
    <div class="sheet-head">
      <span class="chip" id="chip" aria-live="polite">0 / 25</span>
    </div>
    <div class="grid-wrap" id="gridWrap">
      <div class="grid" id="grid"></div>
      <svg class="strikes" id="strikes" viewBox="0 0 500 500" aria-hidden="true"></svg>
      <div class="fx" id="fx" aria-hidden="true"></div>
    </div>
    <div class="foot">
      <button class="text-btn" id="reset" type="button">Nouvelle grille</button>
    </div>
  </section>

  <section class="notes" aria-label="Notes">
    <h2>À suivre</h2>
    <ul>
      <li>Valider le budget T1 avec la DAF avant le 15/11</li>
      <li>Envoyer le support mis à jour aux participants</li>
      <li>Prochain Copil : à caler en semaine 47</li>
    </ul>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg class="toast-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20"/><path pathLength="1" d="M12.5 20.5l5 5 10-11"/></svg>
  <div class="toast-body">
    <div class="toast-word" id="toastWord"></div>
    <div class="toast-sub" id="toastSub"></div>
  </div>
  <div class="toast-actions">
    <button type="button" id="toastNew">Nouvelle grille</button>
    <button type="button" class="primary" id="toastOk">Continuer</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var WORDS = [
    "Synergie","Fusion","Levier","Écosystème","Valeur ajoutée","Cœur de métier","Résilience","Paradigme",
    "Efficience","Agilité","Bienveillance","Chantier","Gouvernance","Feuille de route","Plan stratégique","Parties prenantes",
    "Conduite du changement","Croissance organique","Création de valeur","Gains de productivité","Transformation numérique","Intelligence artificielle","Raison d'être","Ambition",
    "Trajectoire","Dynamique","Excellence opérationnelle","Satisfaction client","Innovation","Engagement","Fierté","Sobriété",
    "Talents","Collaborateurs","Défis","Opportunités","Valeurs","Sens","Mobilisation","Développement durable",
    "Transverse","Disruptif","Pragmatique","Structurant","Solide","Historique","Exigeant","Impacter",
    "Mutualiser","Optimiser","Capitaliser","Fédérer","Embarquer","Prioriser","Accélérer","Pérenniser",
    "Valoriser","Piloter","Déployer","Accompagner","Challenger","Dérisquer","Réinventer","Prendre de la hauteur",
    "Dans les tuyaux","À date","In fine","Au global","Monter en compétence","Sortir du cadre","Ça fait sens","Mettre en musique",
    "Bouger les lignes","Garder le cap","Avoir de la visibilité","Remontées du terrain","Vision à 360°","Prochaines étapes","Année charnière","Contexte incertain",
    "Un monde qui change","Être au rendez-vous","Collectivement","Je passe la parole à","Merci à toutes et à tous","Bravo aux équipes","Au cœur de notre stratégie","Chiffres clés"
  ];
  WORDS = Array.from(new Set(WORDS));

  var LINES = [];
  for (var r = 0; r < 5; r++) LINES.push({id:"r"+r, name:"Ligne "+(r+1), kind:"row", n:r, cells:[0,1,2,3,4].map(function(c){return r*5+c;})});
  for (var c = 0; c < 5; c++) (function(c){ LINES.push({id:"c"+c, name:"Colonne "+(c+1), kind:"col", n:c, cells:[0,1,2,3,4].map(function(r){return r*5+c;})}); })(c);
  LINES.push({id:"d1", name:"Diagonale", kind:"d1", cells:[0,6,12,18,24]});
  LINES.push({id:"d2", name:"Diagonale inverse", kind:"d2", cells:[4,8,12,16,20]});

  var $ = function(id){ return document.getElementById(id); };
  var grid = $("grid"), strikes = $("strikes"), fx = $("fx"), chip = $("chip"), app = $("app");
  var toast = $("toast"), toastWord = $("toastWord"), toastSub = $("toastSub");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var cells = [], marked = [], words = [], done = new Set(), busy = false;
  var chipTimer = 0, toastTimer = 0, armTimer = 0;

  function rnd(n){
    try { var u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] % n; }
    catch(e){ return Math.floor(Math.random()*n); }
  }
  function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=rnd(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function jitter(a){ return (Math.random()*2-1)*a; }

  // A loose, slightly overshooting hand-drawn loop, different for every cell
  function ringPath(){
    var base = [[84,20],[100,44],[94,74],[68,90],[42,100],[10,86],[6,60],[0,32],[26,8],[54,6],[74,4],[90,16],[94,30]];
    var p = base.map(function(pt){ return [Math.round(pt[0]+jitter(4)), Math.round(pt[1]+jitter(4))]; });
    return "M"+p[0]+" C"+p[1]+" "+p[2]+" "+p[3]+" C"+p[4]+" "+p[5]+" "+p[6]+" C"+p[7]+" "+p[8]+" "+p[9]+" C"+p[10]+" "+p[11]+" "+p[12];
  }

  function build(){
    words = shuffle(WORDS.slice()).slice(0,25);
    marked = new Array(25).fill(false);
    var frag = document.createDocumentFragment();
    for (var i=0;i<25;i++){
      var b = document.createElement("button");
      b.type = "button"; b.className = "cell"; b.dataset.i = i;
      b.setAttribute("aria-pressed","false");
      b.style.setProperty("--d", ((Math.floor(i/5) + i%5) * 38) + "ms");
      b.style.setProperty("--rot", jitter(9).toFixed(1) + "deg");
      b.innerHTML = '<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><path pathLength="1" d="'+ringPath()+'"/></svg><span class="w"></span>';
      b.querySelector(".w").textContent = words[i];
      frag.appendChild(b); cells.push(b);
    }
    grid.appendChild(frag);
    updateChip(true);
  }

  function count(){ return marked.filter(Boolean).length; }
  function updateChip(force){
    if (!force && chip.classList.contains("flash")) return;
    var n = count(), l = done.size;
    chip.textContent = n + " / 25" + (l ? " · " + l + (l > 1 ? " lignes" : " ligne") : "");
  }

  function flipChip(text){
    clearTimeout(chipTimer);
    chip.classList.add("flash");
    chip.innerHTML = "";
    Array.from(text).forEach(function(ch,k){
      var s = document.createElement("span");
      s.textContent = ch === " " ? " " : ch;
      s.style.setProperty("--k", k);
      chip.appendChild(s);
    });
    chipTimer = setTimeout(function(){ chip.classList.remove("flash"); updateChip(true); }, 3600);
  }

  function toggle(i){
    marked[i] = !marked[i];
    var el = cells[i];
    el.classList.toggle("on", marked[i]);
    el.setAttribute("aria-pressed", String(marked[i]));
    if (!reduce) el.animate(
      [{transform:"scale(1)"},{transform:"scale(.92)"},{transform:"scale(1.03)"},{transform:"scale(1)"}],
      {duration:380, easing:"cubic-bezier(.3,.7,.4,1)"}
    );
    evaluate();
  }

  function evaluate(){
    var complete = LINES.filter(function(L){ return L.cells.every(function(i){ return marked[i]; }); });
    var ids = new Set(complete.map(function(L){ return L.id; }));
    Array.from(done).forEach(function(id){ if (!ids.has(id)){ done.delete(id); removeStrike(id); } });
    var winSet = new Set();
    complete.forEach(function(L){ L.cells.forEach(function(i){ winSet.add(i); }); });
    cells.forEach(function(el,i){ el.classList.toggle("win", winSet.has(i)); });
    var fresh = complete.filter(function(L){ return !done.has(L.id); });
    fresh.forEach(function(L){ done.add(L.id); });
    updateChip();
    if (fresh.length) celebrate(fresh);
  }

  function strikePath(L){
    var a, b;
    if (L.kind === "row"){ var y = L.n*100+50; a=[16,y+jitter(5)]; b=[484,y+jitter(5)]; }
    else if (L.kind === "col"){ var x = L.n*100+50; a=[x+jitter(5),16]; b=[x+jitter(5),484]; }
    else if (L.kind === "d1"){ a=[22,24]; b=[478,476]; }
    else { a=[478,24]; b=[22,476]; }
    var mx = (a[0]+b[0])/2 + jitter(9), my = (a[1]+b[1])/2 + jitter(9);
    return "M"+a[0].toFixed(1)+" "+a[1].toFixed(1)+" Q"+mx.toFixed(1)+" "+my.toFixed(1)+" "+b[0].toFixed(1)+" "+b[1].toFixed(1);
  }
  function addStrike(L){
    var p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", strikePath(L));
    p.setAttribute("pathLength","1");
    p.dataset.id = L.id;
    strikes.appendChild(p);
  }
  function removeStrike(id){
    var p = strikes.querySelector('path[data-id="'+id+'"]');
    if (!p) return;
    p.classList.add("out");
    setTimeout(function(){ p.remove(); }, 380);
  }

  function burst(i, delay){
    if (reduce) return;
    var wrap = fx.getBoundingClientRect(), r = cells[i].getBoundingClientRect();
    var cx = r.left - wrap.left + r.width/2, cy = r.top - wrap.top + r.height/2;
    for (var k=0;k<7;k++){
      var d = document.createElement("span");
      d.className = "dot" + (k%2 ? " dash" : "");
      d.style.left = cx+"px"; d.style.top = cy+"px";
      fx.appendChild(d);
      var ang = Math.random()*Math.PI*2, dist = r.width*(.45 + Math.random()*.35);
      var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist, rot = ang*180/Math.PI;
      var anim = d.animate([
        {transform:"translate(0,0) rotate("+rot+"deg) scale(.4)", opacity:0},
        {transform:"translate("+dx*.55+"px,"+dy*.55+"px) rotate("+rot+"deg) scale(1)", opacity:.9, offset:.35},
        {transform:"translate("+dx+"px,"+dy+"px) rotate("+rot+"deg) scale(.6)", opacity:0}
      ], {duration:700+Math.random()*250, delay:delay, easing:"cubic-bezier(.15,.7,.3,1)", fill:"both"});
      anim.onfinish = (function(node){ return function(){ node.remove(); }; })(d);
    }
  }

  function celebrate(lines){
    var full = count() === 25;
    lines.forEach(function(L, li){
      addStrike(L);
      L.cells.forEach(function(i,k){
        var delay = li*180 + k*75;
        if (!reduce) cells[i].animate([
          {transform:"scale(1)"},
          {transform:"scale(1.09)", offset:.4},
          {transform:"scale(.98)", offset:.75},
          {transform:"scale(1)"}
        ], {duration:520, delay:delay, easing:"cubic-bezier(.3,.7,.3,1)"});
        burst(i, delay + 120);
      });
    });
    var word = full ? "CARTON PLEIN !" : "BINGO !";
    flipChip(word);
    var sub = full ? "Les 25 mots sont relevés"
      : (lines.length > 1 ? lines.length + " lignes complètes" : lines[0].name + " complète")
        + " · " + count() + " mots relevés";
    showToast(word, sub);
  }

  function showToast(word, sub){
    clearTimeout(toastTimer);
    toastWord.innerHTML = "";
    Array.from(word).forEach(function(ch,k){
      var s = document.createElement("span");
      s.textContent = ch === " " ? " " : ch;
      s.style.setProperty("--k", k);
      toastWord.appendChild(s);
    });
    toastSub.textContent = sub;
    toast.classList.remove("show");
    void toast.offsetWidth;
    toast.classList.add("show");
    toastTimer = setTimeout(hideToast, 5600);
  }
  function hideToast(){ clearTimeout(toastTimer); toast.classList.remove("show"); }

  function newGrid(){
    if (busy) return;
    busy = true;
    hideToast();
    disarm();
    var next = shuffle(WORDS.slice()).slice(0,25);
    done.clear();
    Array.from(strikes.querySelectorAll("path")).forEach(function(p){ removeStrike(p.dataset.id); });
    marked = new Array(25).fill(false);
    var left = 25;
    cells.forEach(function(el,i){
      var delay = (Math.floor(i/5) + i%5) * 32;
      var swap = function(){
        el.classList.remove("on","win");
        el.setAttribute("aria-pressed","false");
        el.style.setProperty("--rot", jitter(9).toFixed(1) + "deg");
        el.querySelector(".ring path").setAttribute("d", ringPath());
        el.querySelector(".w").textContent = next[i];
      };
      var finish = function(){ if (--left === 0){ busy = false; words = next; updateChip(true); } };
      if (reduce){ swap(); finish(); return; }
      var out = el.animate([{transform:"perspective(400px) rotateY(0)"},{transform:"perspective(400px) rotateY(90deg)"}],
        {duration:190, delay:delay, easing:"cubic-bezier(.5,0,.9,.5)", fill:"forwards"});
      out.onfinish = function(){
        swap();
        var back = el.animate([{transform:"perspective(400px) rotateY(-90deg)"},{transform:"perspective(400px) rotateY(0)"}],
          {duration:300, easing:"cubic-bezier(.2,.8,.3,1.25)"});
        out.cancel();
        back.onfinish = finish;
      };
    });
    updateChip(true);
  }

  // Reset needs a second tap so a stray touch never wipes the card
  var resetBtn = $("reset");
  function disarm(){ clearTimeout(armTimer); resetBtn.classList.remove("armed"); resetBtn.textContent = "Nouvelle grille"; }
  resetBtn.addEventListener("click", function(){
    if (resetBtn.classList.contains("armed")){ newGrid(); return; }
    if (count() === 0){ newGrid(); return; }
    resetBtn.classList.add("armed");
    resetBtn.textContent = "Confirmer ?";
    armTimer = setTimeout(disarm, 3000);
  });

  grid.addEventListener("click", function(e){
    var el = e.target.closest(".cell");
    if (!el || busy) return;
    if (app.classList.contains("veiled")){ setVeil(false); return; }
    toggle(+el.dataset.i);
  });

  var veilBtn = $("veil");
  function setVeil(on){
    app.classList.toggle("veiled", on);
    veilBtn.setAttribute("aria-pressed", String(on));
    veilBtn.setAttribute("aria-label", on ? "Afficher le contenu" : "Masquer le contenu");
    if (on) hideToast();
  }
  veilBtn.addEventListener("click", function(){ setVeil(!app.classList.contains("veiled")); });

  $("toastOk").addEventListener("click", hideToast);
  $("toastNew").addEventListener("click", newGrid);
  toast.addEventListener("pointerenter", function(){ clearTimeout(toastTimer); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") hideToast(); });

  // Plausible meeting header: today's date and a live clock
  function tick(){
    var now = new Date();
    try {
      $("date").textContent = now.toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"});
      $("clock").textContent = now.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
    } catch(e){}
  }
  tick(); setInterval(tick, 15000);

  build();
})();
</script>
</body>
</html>
